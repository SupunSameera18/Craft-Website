<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover a wide range of handcrafted products at Krafts by Lady Sara. From unique home decor to personalized gifts, each item is carefully crafted with love and attention to detail. Shop now and bring a touch of craftsmanship into your life."
    />
    <title>Kraft Lady by Sara</title>
<!--@include head-->
    <link rel="preload" href="images/1-mob.webp" as="image" />
  </head>
  <body>
    <!-- Flower Animation -->
    <div id="flower-container"></div>
    <!-- Navigation Bar -->
<!--@include nav-->

    <!-- Section 1 -->
    <section id="Section-1" class="container-fluid">
      <div class="content">
        <div data-aos="fade-up" class="curved-text" aria-hidden="true">
          <svg>
            <path
              id="circlePath-1"
              d="M 150, 150 m -100, 0 a 100,100 0 1,1 200,0 a 100,100 0 1,1 -200,0"
              fill="none"
              stroke="none"
            />
            <text>
              <textpath
                href="#circlePath-1"
                startOffset="25%"
                text-anchor="middle"
              >
                Kraft Lady by Sara
              </textpath>
            </text>
          </svg>
        </div>
        <p data-aos="fade-up" class="main-title">Colorful Universe</p>
        <p data-aos="fade-up" class="d-inline-block description">
          Step into our colorful universe and find joy in evey corner.
        </p>
      </div>
    </section>

    <!-- Section 2 -->
    <section id="Section-2" class="container-fluid">
      <div class="content">
        <div data-aos="fade-up" class="curved-text" aria-hidden="true">
          <svg>
            <path
              id="circlePath-2"
              d="M 150, 150 m -100, 0 a 100,100 0 1,1 200,0 a 100,100 0 1,1 -200,0"
              fill="none"
              stroke="none"
            />
            <text>
              <textpath
                href="#circlePath-2"
                startOffset="25%"
                text-anchor="middle"
              >
                Create Your Own Magic
              </textpath>
            </text>
          </svg>
        </div>
        <p data-aos="fade-up" class="main-title">Vlog Vibes</p>
        <p data-aos="fade-up" class="d-inline-block description">
          Capturing moments, sharing stories and <br />
          positive vibes through vlogs.
        </p>
        <div class="d-flex justify-content-center" data-aos="fade-up">
          <a
            href="https://youtube.com/@himeshithisara?si=7oSLnsUvDNmCHQdg"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Visit our YouTube channel"
            class="yt-btn-red"
          >
            <i class="fab fa-youtube"></i> YouTube
          </a>
        </div>
      </div>
    </section>

    <!-- Section 3 -->
    <section id="Section-3" class="container-fluid">
      <div class="content">
        <div data-aos="fade-up" class="curved-text" aria-hidden="true">
          <svg>
            <path
              id="circlePath-3"
              d="M 150, 150 m -100, 0 a 100,100 0 1,1 200,0 a 100,100 0 1,1 -200,0"
              fill="none"
              stroke="none"
            />
            <text>
              <textpath
                href="#circlePath-3"
                startOffset="25%"
                text-anchor="middle"
              >
                Explore
              </textpath>
            </text>
          </svg>
        </div>
        <p data-aos="fade-up" class="main-title">Tiny Moments</p>
        <p data-aos="fade-up" class="d-inline-block description">
          Small joys light up everyday.
        </p>
        <div class="d-flex justify-content-center" data-aos="fade-up">
          <a
            href="blog.html"
            rel="noopener noreferrer"
            aria-label="Visit our Blog page"
            class="blog-cta-btn"
          >
            Blogs
          </a>
        </div>
      </div>
    </section>

    <!-- Section 4 -->
    <section id="Section-4" class="container-fluid">
      <div class="content">
        <p data-aos="fade-up" class="main-title">Subscribe</p>
        <p data-aos="fade-up" class="d-inline-block description">
          Be the first to know about new collections and exclusive offers.
        </p>
      </div>
    </section>

    <!-- Footer -->
<!--@include footer-->
    <!-- JS Scripts -->
<!--@include scripts-common-->
    <script src="js/flowers.js"></script>
  </body>
</html>
